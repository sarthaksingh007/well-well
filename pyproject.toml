[project]
name = "wellwell"
version = "0.1.0"
description = "Well-Well: an evidence-first copilot for oil-well operations, built on Gemma 4"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "google-genai>=1.0",
    "httpx>=0.27",
    "sqlglot>=25.0",
    "pypdf>=5.0",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
    "typer>=0.12",
    "psycopg[binary]>=3.2",
    "markdown>=3.11.1",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.3", "torch>=2.5"]

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
wellwell = "wellwell.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wellwell"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
